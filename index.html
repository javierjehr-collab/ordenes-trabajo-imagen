<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordenes de Trabajo Extra - Imagen y Espacios</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 10px; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; }
        .admin-btn { background: rgba(255,255,255,0.3); border: 1px solid white; color: white; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 12px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .photo-box { border: 2px dashed #ddd; border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; background: white; }
        .photo-box:hover { border-color: #667eea; background: #f0f4ff; }
        .photo-box img { max-width: 100%; max-height: 150px; border-radius: 6px; margin-bottom: 8px; }
        .photo-box input { display: none; }
        .photo-label { display: block; font-size: 12px; color: #888; margin-top: 8px; }
        .signature-box { border: 2px solid #ddd; border-radius: 8px; background: white; margin-bottom: 16px; }
        canvas { display: block; width: 100%; border-radius: 6px; touch-action: none; }
        .signature-actions { display: flex; gap: 10px; padding: 10px; justify-content: center; }
        .btn-clear { background: #ff6b6b; color: white; padding: 8px 16px; font-size: 12px; border: none; border-radius: 4px; cursor: pointer; }
        .btn-submit { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .status { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        .status.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .sync-status { font-size: 12px; color: #888; text-align: center; margin-top: 10px; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #f3f3f3; border-top: 2px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .admin-section { margin-bottom: 20px; }
        .admin-section h3 { margin-bottom: 12px; color: #667eea; }
        .admin-input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .admin-input-group input { flex: 1; }
        .admin-input-group button { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; white-space: nowrap; }
        .admin-list { background: #f9f9f9; border-radius: 6px; padding: 10px; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: white; margin-bottom: 8px; border-radius: 4px; font-size: 14px; }
        .pin-display { background: #f0f4ff; padding: 4px 8px; border-radius: 3px; font-family: monospace; font-weight: 600; color: #667eea; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwhiMjpUIgPfBA6nNMrVsAJ9mXy9BZRjvk7UlyailHAZTagKKk0gx5a3rARz5ZHyO5L/exec';

    async function callScript(action, data = {}) {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action, ...data })
        });
        return await response.json();
    }

    function App() {
        const [screen, setScreen] = useState('login');
        const [projects, setProjects] = useState([]);
        const [installers, setInstallers] = useState([]);
        const [currentInstaller, setCurrentInstaller] = useState(null);
        const [pin, setPin] = useState('');
        const [pinError, setPinError] = useState('');
        const [loadingData, setLoadingData] = useState(true);
        const [projectName, setProjectName] = useState('');
        const [workType, setWorkType] = useState('Desbaste de vano');
        const [description, setDescription] = useState('');
        const [clientName, setClientName] = useState('');
        const [photoBefore, setPhotoBefore] = useState(null);
        const [photoAfter, setPhotoAfter] = useState(null);
        const [selfie, setSelfie] = useState(null);
        const [signatureData, setSignatureData] = useState(null);
        const [formStatus, setFormStatus] = useState('');
        const [syncStatus, setSyncStatus] = useState('');
        const [submitting, setSubmitting] = useState(false);
        const canvasRef = useRef(null);
        const isDrawing = useRef(false);

        useEffect(() => { loadData(); }, []);

        const loadData = async () => {
            setLoadingData(true);
            try {
                const [projRes, instRes] = await Promise.all([
                    callScript('getProjects'),
                    callScript('getInstallers')
                ]);
                if (projRes.success) setProjects(projRes.data.map(p => p.nombre));
                if (instRes.success) setInstallers(instRes.data);
            } catch (e) {
                console.error('Error cargando datos:', e);
            }
            setLoadingData(false);
        };

        const handlePinLogin = () => {
            if (pin === '9107') {
                setPin(''); setPinError(''); setScreen('admin');
                return;
            }
            const installer = installers.find(i => String(i.pin) === String(pin));
            if (installer) {
                setCurrentInstaller(installer);
                setPin(''); setPinError(''); setScreen('form');
            } else {
                setPinError('PIN incorrecto'); setPin('');
            }
        };

        const handlePhotoCapture = (type, event) => {
            const file = event.target.files[0];
            if (file) {
                // Comprimir imagen antes de guardar
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 800;
                        let w = img.width, h = img.height;
                        if (w > h && w > MAX) { h = h * MAX / w; w = MAX; }
                        else if (h > MAX) { w = w * MAX / h; h = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        if (type === 'before') setPhotoBefore(compressed);
                        if (type === 'after') setPhotoAfter(compressed);
                        if (type === 'selfie') setSelfie(compressed);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        useEffect(() => {
            if (screen === 'form' && canvasRef.current && !signatureData) {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                const ctx = canvas.getContext('2d');
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                ctx.lineWidth = 2; ctx.strokeStyle = '#333';
            }
        }, [screen, signatureData]);

        const getPos = (e, canvas) => {
            const rect = canvas.getBoundingClientRect();
            const src = e.touches ? e.touches[0] : e;
            return {
                x: (src.clientX - rect.left) * window.devicePixelRatio,
                y: (src.clientY - rect.top) * window.devicePixelRatio
            };
        };

        const startDraw = (e) => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const pos = getPos(e, canvas);
            isDrawing.current = true;
            ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
        };

        const draw = (e) => {
            if (!isDrawing.current) return;
            if (e.touches) e.preventDefault();
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const pos = getPos(e, canvas);
            ctx.lineTo(pos.x, pos.y); ctx.stroke();
        };

        const endDraw = () => {
            isDrawing.current = false;
            setSignatureData(canvasRef.current.toDataURL('image/png'));
        };

        const clearSignature = () => {
            const canvas = canvasRef.current;
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
            setSignatureData(null);
        };

        const handleSubmit = async () => {
            if (!projectName || !workType || !description || !clientName || !photoBefore || !photoAfter || !selfie || !signatureData) {
                setFormStatus('error: Completa todos los campos y firma');
                return;
            }
            setSubmitting(true);
            setSyncStatus('Guardando orden...');
            try {
                const result = await callScript('saveOrder', {
                    timestamp: new Date().toISOString(),
                    installer: currentInstaller.nombre,
                    project: projectName,
                    workType, description, clientName,
                    photoBefore, photoAfter, selfie,
                    signature: signatureData
                });
                if (result.success) {
                    setFormStatus('success: ¡Orden guardada correctamente!');
                    setSyncStatus('✓ Sincronizado con Google Sheets');
                    setTimeout(() => {
                        setProjectName(''); setWorkType('Desbaste de vano');
                        setDescription(''); setClientName('');
                        setPhotoBefore(null); setPhotoAfter(null); setSelfie(null);
                        clearSignature(); setFormStatus(''); setSyncStatus('');
                    }, 3000);
                } else {
                    setFormStatus('error: Error al guardar, intenta de nuevo');
                    setSyncStatus('');
                }
            } catch (e) {
                setFormStatus('error: Sin conexión, intenta de nuevo');
                setSyncStatus('');
            }
            setSubmitting(false);
        };

        const handleAddProject = async (nombre) => {
            await callScript('addProject', { nombre });
            setProjects([...projects, nombre]);
        };

        const handleAddInstaller = async (nombre, pin) => {
            await callScript('addInstaller', { nombre, pin });
            setInstallers([...installers, { nombre, pin }]);
        };

        if (loadingData) return (
            <div className="container" style={{ marginTop: '80px', textAlign: 'center' }}>
                <div className="spinner" style={{ width: 30, height: 30, borderWidth: 3, margin: '0 auto 16px' }}></div>
                <p>Cargando configuración...</p>
            </div>
        );

        return (
            <div className="container">
                <div className="header">
                    <h1>📋 Ordenes de Trabajo</h1>
                    {screen === 'admin' && (
                        <button className="admin-btn" onClick={() => setScreen('login')}>
                            Cerrar
                        </button>
                    )}
                </div>

                {screen === 'login' && (
                    <div style={{ marginTop: 40 }}>
                        <div style={{ textAlign: 'center', marginBottom: 30 }}>
                            <h2 style={{ fontSize: 24, marginBottom: 10 }}>Bienvenido</h2>
                            <p style={{ color: '#888', fontSize: 14 }}>Ingresa tu PIN para comenzar</p>
                        </div>
                        <div className="form-group">
                            <input type="password" placeholder="Ingresa tu PIN (4-6 dígitos)"
                                value={pin} onChange={e => setPin(e.target.value)}
                                onKeyPress={e => e.key === 'Enter' && handlePinLogin()}
                                maxLength="6" inputMode="numeric" autoFocus />
                        </div>
                        {pinError && <div className="status error" style={{ marginBottom: 16 }}>❌ {pinError}</div>}
                        <button className="btn-submit" onClick={handlePinLogin}>Acceder</button>
                    </div>
                )}

                {screen === 'form' && (
                    <div>
                        <div style={{ marginBottom: 20, padding: 12, background: '#e3f2fd', borderRadius: 6, fontSize: 14 }}>
                            👤 <strong>{currentInstaller.nombre}</strong>
                            <button onClick={() => { setScreen('login'); setCurrentInstaller(null); }}
                                style={{ float: 'right', background: 'none', border: 'none', color: '#1976d2', cursor: 'pointer', fontSize: 12 }}>
                                Cerrar sesión
                            </button>
                        </div>

                        {formStatus && (
                            <div className={`status ${formStatus.includes('error') ? 'error' : 'success'}`} style={{ marginBottom: 16 }}>
                                {formStatus.replace('error: ', '').replace('success: ', '')}
                            </div>
                        )}

                        <div className="form-group">
                            <label>Proyecto *</label>
                            <select value={projectName} onChange={e => setProjectName(e.target.value)}>
                                <option value="">Selecciona un proyecto</option>
                                {projects.map((p, i) => <option key={i} value={p}>{p}</option>)}
                            </select>
                        </div>

                        <div className="form-group">
                            <label>Tipo de Trabajo *</label>
                            <select value={workType} onChange={e => setWorkType(e.target.value)}>
                                <option>Desbaste de vano</option>
                                <option>Desbaste de Firme</option>
                                <option>Ajuste de Herraje</option>
                                <option>Suministro y Colocación de Herraje</option>
                            </select>
                        </div>

                        <div className="form-group">
                            <label>Descripción del Trabajo *</label>
                            <textarea placeholder="Describe en detalle el trabajo realizado..."
                                value={description} onChange={e => setDescription(e.target.value)} />
                        </div>

                        <div className="form-group">
                            <label>Nombre de quien Autoriza *</label>
                            <input type="text" placeholder="Residente, jefe de obra o superintendente"
                                value={clientName} onChange={e => setClientName(e.target.value)} />
                        </div>

                        <div className="form-group">
                            <label>📸 Fotos *</label>
                            <div className="photo-grid">
                                <div className="photo-box" onClick={() => document.getElementById('photoBefore').click()}>
                                    {photoBefore ? <img src={photoBefore} alt="Antes" /> : <div style={{ padding: 20, color: '#999' }}>📷</div>}
                                    <input id="photoBefore" type="file" accept="image/*" capture="environment"
                                        onChange={e => handlePhotoCapture('before', e)} />
                                    <span className="photo-label">Foto ANTES</span>
                                </div>
                                <div className="photo-box" onClick={() => document.getElementById('photoAfter').click()}>
                                    {photoAfter ? <img src={photoAfter} alt="Después" /> : <div style={{ padding: 20, color: '#999' }}>📷</div>}
                                    <input id="photoAfter" type="file" accept="image/*" capture="environment"
                                        onChange={e => handlePhotoCapture('after', e)} />
                                    <span className="photo-label">Foto DESPUÉS</span>
                                </div>
                            </div>
                        </div>

                        <div className="form-group">
                            <label>🤳 Selfie (prueba de quién captura) *</label>
                            <div className="photo-box" onClick={() => document.getElementById('selfie').click()}>
                                {selfie ? <img src={selfie} alt="Selfie" /> : <div style={{ padding: 20, color: '#999' }}>📱 Tu foto</div>}
                                <input id="selfie" type="file" accept="image/*" capture="user"
                                    onChange={e => handlePhotoCapture('selfie', e)} />
                                <span className="photo-label">Cámara frontal</span>
                            </div>
                        </div>

                        <div className="form-group">
                            <label>✍️ Firma del Cliente *</label>
                            <div className="signature-box">
                                <canvas ref={canvasRef}
                                    onMouseDown={startDraw} onMouseMove={draw} onMouseUp={endDraw}
                                    onTouchStart={startDraw} onTouchMove={draw} onTouchEnd={endDraw}
                                    style={{ height: 150, cursor: 'crosshair' }} />
                                <div className="signature-actions">
                                    <button className="btn-clear" onClick={clearSignature}>Limpiar</button>
                                </div>
                            </div>
                        </div>

                        <button className="btn-submit" onClick={handleSubmit} disabled={submitting}>
                            {submitting ? <><span className="spinner"></span>Guardando...</> : '💾 Guardar Orden de Trabajo'}
                        </button>

                        {syncStatus && <div className="sync-status">{syncStatus}</div>}
                    </div>
                )}

                {screen === 'admin' && (
                    <div>
                        <button className="btn-submit" onClick={loadData} style={{ marginBottom: 20 }}>
                            🔄 Recargar desde Google Sheets
                        </button>

                        <div className="admin-section">
                            <h3>➕ Agregar Proyecto</h3>
                            <AdminAddProject onAdd={handleAddProject} />
                            <div className="admin-list">
                                {projects.length === 0
                                    ? <p style={{ color: '#999', fontSize: 12 }}>Sin proyectos aún</p>
                                    : projects.map((p, i) => <div key={i} className="admin-item">{p}</div>)
                                }
                            </div>
                        </div>

                        <div className="admin-section">
                            <h3>➕ Agregar Instalador</h3>
                            <AdminAddInstaller onAdd={handleAddInstaller} />
                            <div className="admin-list">
                                {installers.length === 0
                                    ? <p style={{ color: '#999', fontSize: 12 }}>Sin instaladores aún</p>
                                    : installers.map((inst, i) => (
                                        <div key={i} className="admin-item">
                                            <span>{inst.nombre} <span className="pin-display">{inst.pin}</span></span>
                                        </div>
                                    ))
                                }
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    function AdminAddProject({ onAdd }) {
        const [val, setVal] = useState('');
        return (
            <div className="admin-input-group">
                <input type="text" placeholder="Nombre del proyecto" value={val} onChange={e => setVal(e.target.value)} />
                <button onClick={() => { if (val.trim()) { onAdd(val.trim()); setVal(''); } }}>Agregar</button>
            </div>
        );
    }

    function AdminAddInstaller({ onAdd }) {
        const [nombre, setNombre] = useState('');
        const [pin, setPin] = useState('');
        return (
            <div className="admin-input-group">
                <input type="text" placeholder="Nombre" value={nombre} onChange={e => setNombre(e.target.value)} />
                <input type="text" placeholder="PIN" value={pin}
                    onChange={e => setPin(e.target.value.replace(/\D/g, '').slice(0, 6))}
                    maxLength="6" inputMode="numeric" />
                <button onClick={() => {
                    if (nombre.trim() && pin.length >= 4) { onAdd(nombre.trim(), pin); setNombre(''); setPin(''); }
                }}>Agregar</button>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
